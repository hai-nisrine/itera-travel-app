name: Itera CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itera_test
          POSTGRES_USER: itera_user
          POSTGRES_PASSWORD: itera_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itera_user -d itera_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: itera_user
      DB_PASSWORD: itera_password
      DB_NAME: itera_test

    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "22"

        - name: Install dependencies
          run: npm ci

        - name: Apply migrations
          working-directory: database
          run: |
            for f in $(ls *.sql | sort); do
              echo "Running $f"
              PGPASSWORD=itera_password psql -h localhost -U itera_user -d itera_test -v ON_ERROR_STOP=1 -f "$f"
            done

        - name: Run tests
          run: npm test

  agent:
    name: Test AI Agent PoC (mocked, no API calls)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: itera-poc-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
