
name: Itera CI

# Trigger CI whenever code is pushed
# or a Pull Request is opened or updated.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Create a temporary PostgreSQL database for testing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itera_test
          POSTGRES_USER: itera_user
          POSTGRES_PASSWORD: itera_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itera_user -d itera_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: itera_user
      DB_PASSWORD: itera_password
      DB_NAME: itera_test

    steps:
      # Get the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build the application if a build script exists
      - name: Build application
        run: npm run build --if-present

      # Initialize database schema if a migration script exists
      - name: Initialize database
        run: npm run migrate --if-present

      # Run automated tests
      - name: Run tests
        run: npm test
